[package]
name = "purrzip-app"
version = "0.2.0"
description = "Purrzip by GmCat: open and make archives"
authors = ["GmCat"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/GmCat-dev/purrzip"
edition = "2024"
rust-version = "1.90"

[lib]
name = "purrzip_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
purrzip-service = { path = "../../service" }
serde_json = "1.0"
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
