# Runs the Windows installer from a "Build Purrzip" run on a real Windows machine and takes screenshots of each
# page, then of a .purr file in File Explorer (to check its icon). Started by hand with the build's run id.
name: Windows installer screenshots
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a finished 'Build Purrzip' run"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: purrzip-windows-latest
          path: build
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install while taking screenshots
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shell = New-Object -ComObject WScript.Shell
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $setup = Get-ChildItem -Recurse build -Filter *-setup.exe | Select-Object -First 1
          Write-Host "installer: $($setup.FullName)"
          Shot "0-desktop"
          $p = Start-Process -FilePath $setup.FullName -PassThru
          for ($i = 1; $i -le 7; $i++) {
            Start-Sleep -Seconds 6
            $null = $shell.AppActivate($p.Id)
            Start-Sleep -Milliseconds 500
            Shot "$i-page"
            if ($p.HasExited) { break }
            $shell.SendKeys("{ENTER}")
          }
          Start-Sleep -Seconds 4
          Get-Process | Where-Object { $_.ProcessName -like "purrzip*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "--- registry"
          reg query "HKCU\Software\Classes\.purr" /s
          reg query "HKCU\Software\Classes\Purrzip archive" /s
          Write-Host "--- installed files"
          Get-ChildItem "$env:LOCALAPPDATA\Purrzip" | Format-Table Name, Length
      - name: A .purr file in File Explorer
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $d = "C:\Purr files"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Set-Content -Path "$d\Holiday photos.purr" -Value "test"
          Set-Content -Path "$d\Backup.zip" -Value "test"
          # large icons in this folder
          Start-Process explorer.exe -ArgumentList "`"$d`""
          Start-Sleep -Seconds 6
          $shell = New-Object -ComObject WScript.Shell
          $null = $shell.AppActivate("Purr files")
          Start-Sleep -Milliseconds 500
          $shell.SendKeys("^+2")
          Start-Sleep -Seconds 3
          Shot "8-explorer"
      - name: Right-click menu entries and actions
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $exe = "$env:LOCALAPPDATA\Purrzip\purrzip-app.exe"
          Write-Host "--- menu entries"
          reg query "HKCU\Software\Classes\SystemFileAssociations\.zip\shell\Purrzip" /s
          reg query "HKCU\Software\Classes\*\shell\Purrzip" /v AppliesTo
          reg query "HKCU\Software\Classes\Directory\shell\Purrzip\shell" /s
          $m = "C:\Menu test"
          New-Item -ItemType Directory -Force -Path "$m\Trip" | Out-Null
          Set-Content -Path "$m\Trip\notes.txt" -Value "hello from the menu test"
          Set-Content -Path "$m\todo.txt" -Value "todo"
          Compress-Archive -Path "$m\Trip" -DestinationPath "$m\Trip.zip"
          function Run($argsList, $check, $name) {
            Get-Process | Where-Object { $_.ProcessName -like "purrzip*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Process -FilePath $exe -ArgumentList $argsList
            for ($i = 0; $i -lt 40; $i++) { Start-Sleep -Seconds 1; if (& $check) { break } }
            Start-Sleep -Seconds 2
            Shot $name
            if (& $check) { Write-Host "ok   $name" } else { Write-Host "FAIL $name" }
          }
          Run @('--add-purr', "`"$m\Trip`"") { Test-Path "$m\Trip.purr" } "9-add-purr"
          Run @('--extract-new', "`"$m\Trip.purr`"") { Test-Path "$m\Trip (2)\Trip\notes.txt" } "10-extract-new"
          Run @('--add-zip', "`"$m\todo.txt`"") { Test-Path "$m\todo.zip" } "11-add-zip"
          Run @('--test', "`"$m\Trip.purr`"") { $false } "12-test"
          Get-Process | Where-Object { $_.ProcessName -like "purrzip*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse $m | Format-Table FullName, Length
          # the menu itself, as File Explorer shows it: find the file with UI Automation, Shift + right-click it
          # (Shift shows the full menu straight away on Windows 11), then point at "Purrzip"
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class Mouse { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, IntPtr e); [DllImport("user32.dll")] public static extern void keybd_event(byte k, byte s, uint f, IntPtr e); public static void ShiftRightClick(int x, int y) { SetCursorPos(x, y); keybd_event(0x10, 0, 0, IntPtr.Zero); mouse_event(0x0008, 0, 0, 0, IntPtr.Zero); mouse_event(0x0010, 0, 0, 0, IntPtr.Zero); keybd_event(0x10, 0, 2, IntPtr.Zero); } public static void Move(int x, int y) { SetCursorPos(x, y); } }'
          $A = [System.Windows.Automation.AutomationElement]
          $T = [System.Windows.Automation.TreeScope]
          function Find($parent, $name) {
            $c = New-Object System.Windows.Automation.PropertyCondition($A::NameProperty, $name)
            for ($i = 0; $i -lt 20; $i++) { $e = $parent.FindFirst($T::Descendants, $c); if ($e) { return $e }; Start-Sleep -Milliseconds 500 }
            return $null
          }
          function Center($e) { $r = $e.Current.BoundingRectangle; return @([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2)) }
          function MenuShot($folder, $item, $label, $name, $row) {
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            Copy-Item -Recurse $item $folder
            Start-Process explorer.exe -ArgumentList "`"$folder`""
            Start-Sleep -Seconds 6
            $win = Find $A::RootElement (Split-Path $folder -Leaf)
            if (-not $win) { Write-Host "no window for $folder"; return }
            $it = Find $win $label
            if (-not $it) { Write-Host "no item $label"; return }
            $p = Center $it
            [Mouse]::ShiftRightClick($p[0], $p[1])
            Start-Sleep -Seconds 3
            Shot "$name-a"
            # the open menu is a "#32768" window; for an archive "Purrzip" is the second line (under "Open")
            $mc = New-Object System.Windows.Automation.PropertyCondition($A::ClassNameProperty, "#32768")
            $menu = $A::RootElement.FindFirst($T::Children, $mc)
            if ($menu -and $row -gt 0) {
              $r = $menu.Current.BoundingRectangle
              [Mouse]::Move([int]($r.X + 60), [int]($r.Y + 14 + 24 * ($row - 1) + 10)); Start-Sleep -Seconds 2
            } else { Write-Host "menu window not found for $label" }
            Shot "$name-b"
            [System.Windows.Forms.SendKeys]::SendWait("{ESC}{ESC}{ESC}")
            Start-Sleep -Seconds 1
          }
          MenuShot "C:\Menu zip" (Join-Path $m "Trip.zip") "Trip" "13-menu-zip" 2
          MenuShot "C:\Menu text" (Join-Path $m "todo.txt") "todo" "14-menu-txt" 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-shots
          path: shots
