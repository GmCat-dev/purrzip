[package]
name = "purrzip-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6.1"
cab = "0.6.0"
flate2 = "1.1.11"
lzma-rust2 = "0.25.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.25.0", features = ["aes256", "compress"] }
tar = "0.4.46"
thiserror = "2.0.21"
unrar = "0.5.8"
walkdir = "2.5.1"
zip = { version = "9.8.1", default-features = false, features = ["aes-crypto", "deflate", "deflate64", "bzip2", "zstd", "lzma", "time"] }
zstd = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"
